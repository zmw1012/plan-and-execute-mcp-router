# Unified HK MCP-Zero adapted baseline (Financial + Market + News + Cross-domain)
# Primary experiment variable vs Operation-Visible: router / orchestration method.
condition: mcp_zero
execution_backend: real_mcp
# Runtime env adapter metadata (not a routing method knob).
# OpenAI-compatible relay at api.zhizengzeng.com; not Alibaba token-plan.
generation_provider: openai_compatible
generation_base_url_host: api.zhizengzeng.com
# Experiment generation model (NOT the Cursor coding agent).
generation_model: deepseek-v4.1-flash
# Shared embedding backbone with Operation-Visible (fair comparison).
# Paper / official matcher used text-embedding-3-large — documented adaptation.
embedding_model: text-embedding-3-small
temperature: 0.0
max_tokens: 1024
# MCP-Zero requires raw <tool_assistant> ATR turns. Forced provider JSON mode
# makes ATR illegal and causes empty-action repair loops (smoke4_v2 failure mode).
json_mode: false
dataset_split: development
dataset_manifest: benchmarks/manifests/hk_unified_dataset_v1.json
smoke_manifest: benchmarks/smoke/hk_unified_dev_smoke_8_v1.json

retrieval:
  # FROZEN before any HK-155 real result.
  # Paper / official matcher default is server_top_k=5, tool_top_k=3.
  # This baseline keeps the ETOM pinned adaptation 3/5.
  # Do not retune these from HK-155 outcomes. A 5/3 run is an independent
  # ablation and must not replace this baseline.
  server_top_k: 3
  tool_top_k: 5
  similarity_threshold: 0.0
  score_mode: official_combined  # paper formula; alt: tool_similarity_only
  use_summary: true

limits:
  max_llm_turns: 8
  max_invocations: 6
  max_extension_rounds: 3
  timeout_sec: 120
  bounded_retry: 1

catalogs:
  financial: configs/operations/financial_real_mcp.yaml
  market: configs/operations/market_real_mcp_v1_1.yaml
  news: configs/operations/news_real_mcp_v1.yaml
  cross_domain: configs/operations/cross_domain_real_mcp_v1.yaml

notes:
  - Must execute real MCP operations via UnifiedRealMcpGateway.
  - Blocked/rejected operations must never be exposed to retrieval or invoke.
  - Cursor / Claude coding models are not experiment variables.
  - Do not read gold/reference answers when generating predictions.
