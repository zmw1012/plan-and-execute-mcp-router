# Operation-Visible baseline configuration
# simplified reimplementation adapted from Ghoshal et al. (2026)

architecture: operation_visible

llm:
  # Loaded from ENV_FILE=.env.aliyun for paid runs; tests use ScriptedLLMClient.
  temperature: 0.0
  max_tokens: 1024
  # Pin model via LLM_MODEL env (e.g. deepseek-v4.1-flash). Never use model=auto.

embedding:
  # Loaded from EMBEDDING_ENV_FILE=.env.embedding-relay
  # Adapted backbone vs paper's cohere.embed-v4.0:
  model: text-embedding-3-small
  # Ranking formula remains: cosine + 0.12 * lexical_score
  lexical_weight: 0.12
  top_k_default: 20
  top_k_max: 20

limits:
  max_llm_turns: 8
  max_search_reformulations: 3
  max_invocations: 6
  timeout_sec: 120

real_mcp:
  # Shared Financial v1 catalog for Real-MCP Operation-Visible / Flat baselines.
  catalog: configs/operations/financial_real_mcp.yaml
  # When enabled, invoke_api routes through RealMcpGateway (never data/mock as tool data).
  enabled_by_default: false

notes:
  - Underlying financial tools are NOT directly exposed to the central model.
  - find_operations / describe_operation are resolver calls, not underlying API calls.
  - Flat mode remains a separate comparison path and is unchanged by this config.
  - Real-MCP catalog: configs/operations/financial_real_mcp.yaml (AKTools + mcp-hkexnews).
