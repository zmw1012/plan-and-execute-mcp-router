# APV-Fin proposed method v1 (separated from Operation-Visible baseline)
condition: apv_fin
method_version: apv_fin_v1
execution_backend: real_mcp

# Formal live identity (fail-closed; no Aliyun silent fallback)
generation_provider: openai_compatible
generation_host: api.zhizengzeng.com
generation_model: deepseek-v4.1-flash
embedding_provider: openai_compatible
embedding_model: text-embedding-3-small
# Formal env files live in the sibling main checkout (never commit keys):
#   GEN_ENV:  ../hk-equity-mcp-agent/.env.relay-v41
#   EMB_ENV:  ../hk-equity-mcp-agent/.env.embedding-relay
# Formal python:
#   ../hk-equity-mcp-agent/.venv-aktools-discovery/bin/python

temperature: 0.0
max_tokens: 2048
json_mode: true
dataset_split: development
dataset_manifest: benchmarks/manifests/hk_unified_dataset_v1.json
diagnostic_manifest: benchmarks/manifests/hk_apv_fin_diagnostic12_v1.json
smoke4_manifest: benchmarks/manifests/hk_apv_fin_real_smoke4_v1.json
operation_metadata: configs/operations/hk_unified_operation_metadata_v1.yaml

retrieval:
  top_k: 20
  lexical_weight: 0.12
  compatibility_tiers: [A, B, C]

# Catalog operation embedding index (shared; not under output_dir)
embedding_cache_namespace: apv_fin_operation_embeddings_v1
embedding_batch_size: 16
embedding_request_timeout_sec: 120
embedding_max_retries: 3
embedding_retry_backoff_seconds: [1, 2, 4]

limits:
  # Bounded replanning — config-driven (do not retune for mock pass).
  max_plan_revisions: 2
  max_targeted_retrievals_per_step: 2
  max_total_mcp_invocations: 8
  max_llm_monitor_rounds: 6
  max_same_operation_repeats: 1
  max_final_repair_rounds: 1
  max_idle_monitor_rounds: 1
  # Global per-task generation cap (planner/monitor/reason/verify/final + repairs).
  # Does not include embedding, MCP, or catalog indexing.
  max_total_llm_calls_per_task: 14
  timeout_sec: 180

catalogs:
  financial: configs/operations/financial_real_mcp.yaml
  market: configs/operations/market_real_mcp_v1_1.yaml
  news: configs/operations/news_real_mcp_v1.yaml
  cross_domain: configs/operations/cross_domain_real_mcp_v1.yaml

notes:
  - Must execute real MCP via UnifiedRealMcpGateway (not ETOM routing-only).
  - Does not modify Operation-Visible baseline behavior, prompts, or raw outputs.
  - Plans never hard-code operation_id; only retrieve steps enter the resolver.
  - No MCP-Zero ATR protocol.
  - Live mode must not enable mock_select_operation_id / forced_select overrides.
