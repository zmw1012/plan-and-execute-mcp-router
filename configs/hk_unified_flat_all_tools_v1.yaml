# Unified HK Flat All Tools baseline (routing ablation vs Operation-Visible)
condition: flat
execution_backend: real_mcp
architecture: flat_all_tools
generation_provider: openai_compatible
generation_base_url_host: api.zhizengzeng.com
generation_model: deepseek-v4.1-flash
# Flat does not use embedding; field retained as null for identity clarity.
embedding_model: null
temperature: 0.0
max_tokens: 1024
json_mode: true
dataset_split: development
dataset_manifest: benchmarks/manifests/hk_unified_dataset_v1.json
smoke_manifest: benchmarks/smoke/hk_unified_dev_smoke_8_v1.json
# Formal generation profile (never commit secrets):
#   ../hk-equity-mcp-agent/.env.relay-v41

limits:
  max_llm_turns: 8
  max_invocations: 6
  timeout_sec: 120
  bounded_retry: 1

catalogs:
  financial: configs/operations/financial_real_mcp.yaml
  market: configs/operations/market_real_mcp_v1_1.yaml
  news: configs/operations/news_real_mcp_v1.yaml
  cross_domain: configs/operations/cross_domain_real_mcp_v1.yaml

notes:
  - Flat All Tools exposes all 39 runtime operations directly each planning turn.
  - No embedding / find_operations / describe_operation / Top-K / MCP-Zero routing.
  - Must execute via UnifiedRealMcpGateway (no FinancialServer silent fallback).
  - Fairness: same HK-155 manifest, model, temperature, FINAL_ANSWER_CONTRACT, evaluator v1.2.
  - "Formal generation: openai_compatible @ api.zhizengzeng.com / deepseek-v4.1-flash via .env.relay-v41 (not Aliyun Token Plan)."
