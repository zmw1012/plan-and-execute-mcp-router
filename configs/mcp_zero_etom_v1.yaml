# MCP-Zero × ETOM routing-only baseline (pilot-10 + formal-100)
condition: mcp_zero
routing_only: true
real_tool_executions: 0
generation_provider: openai_compatible
generation_base_url_host: api.zhizengzeng.com
generation_model: deepseek-v4.1-flash
embedding_model: text-embedding-3-small
temperature: 0.0
max_tokens: 2048
json_mode: false

retrieval:
  # Frozen HK MCP-Zero method card knobs (method-card hash unchanged).
  server_top_k: 3
  tool_top_k: 5
  similarity_threshold: 0.0
  score_mode: official_combined
  use_summary: true

limits:
  max_llm_turns: 8
  max_invocations: 8
  max_extension_rounds: 3
  timeout_sec: 180

pricing:
  llm_input_usd_per_million: 0.14
  llm_output_usd_per_million: 0.28
  embedding_usd_per_million: 0.02

notes:
  - Routing-only baseline; never executes ETOM MCP tools.
  - Route exact match is not final-answer accuracy.
  - Do not retune knobs from ETOM formal-100 or Operation-Visible errors.
