  max_execution_rounds: 7
  max_executed_steps: 7
  max_replan_rounds: 7
  max_new_steps_per_replan: 2
  max_local_fallback_per_retrieve: 1
  retrieval_top_k: 5
  describe_top_n: 3
  timeout_sec: 180

sampler:
  seed: 20261106
  sampler_version: etom_stratified_external_100_v1
  lock_file: benchmarks/etom/formal_100_v1.lock.json

capability_profile: configs/capabilities/etom100_capability_profile_v1.yaml
