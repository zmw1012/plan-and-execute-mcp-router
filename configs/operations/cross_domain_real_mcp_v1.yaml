freeze_status: not_a_domain_catalog_freeze
domain: cross_domain
read_only: true
notes:
- Unified manifest referencing frozen Financial/Market/News catalogs without copying
  operation bodies.
- Do not modify frozen domain catalogs from this branch.
- Operation IDs are namespaced as {domain_ns}::{operation_id} for uniqueness across
  domains.
- Underlying raw MCP tools/servers are deduplicated by server_id + tool name.
- No new tools added in v1; gaps go to docs/cross_domain_mcp_gap_proposals_v1.md.
