    ticker_format: "Index code HSI"
    supported_exchanges: [HKEX]
    frequency: daily
    historical_date_coverage: "Includes 2026-08-12 via negative offset"
    timezone: Asia/Hong_Kong
    currency: index_points
    adjustment_mode: "not_applicable_index_level"
    data_source_provider: East Money via AKShare
    read_only: true
    idempotence: true
    invocation_constraints:
      - "Map latest->close for comparisons"
      - "Filter <=2026-08-12"
    known_risks: ["Field-name mismatch vs Sina close"]
    audit_status: live_verified_HSI_cutoff
    live_evidence: "outputs/mcp_discovery_market_v1/aktools_market_final_recon.json"
    decision: supporting

  - operation_id: aktools.stock_hk_index_spot_sina
    server_id: aktools
    role: supporting
    classification: supporting
    exposed_mcp_tool: get_data
    underlying_interface: stock_hk_index_spot_sina
    name: stock_hk_index_spot_sina
    summary: Resolve Hang Seng Index code (HSI) from Sina HK index spot list.
