# Market Real-MCP candidate catalog (NOT frozen).
# Status: candidate_v1 — tool-first discovery only; no final Market questions yet.
# Separate from configs/operations/financial_real_mcp.yaml (Financial v1 remains frozen/unchanged).
version: 1
catalog_id: market_real_mcp_candidate_v1
catalog_status: candidate_v1
domain: market
read_only: true
freeze_status: not_frozen
notes:
  - Raw MCP tools != logical operations. AKTools exposes 3 raw MCP tools; logical Market ops below map to get_data interfaces (or meta tools).
  - Benchmark temporal policy: max gold date 2026-08-12 Asia/Hong_Kong; never use floating "latest" as gold.
  - Previous-valid-trading-day rule: if requested date absent, use max trading date <= requested date in the same series/adjustment mode.
  - FTShare Market tools are documented as blocked (anonymous 429 / no local API key), not accepted.
  - data/mock market JSON remains offline mock only; never as Real-MCP tool data.

temporal_policy:
  max_data_date: "2026-08-12"
  timezone: Asia/Hong_Kong
  previous_valid_trading_day_rule: >
    If a requested calendar date is missing from the returned series (weekend/holiday),
    select the maximum available session date <= the requested date under the same
    symbol, frequency, and adjustment mode. Do not forward-fill from a later date.
  evidence: >
    stock_hk_hist 00700 window 2026-08-07..2026-08-12 returned sessions
    2026-08-07, 2026-08-10, 2026-08-11, 2026-08-12 (2026-08-08/09 absent).

servers:
  aktools:
    server_id: aktools
    package: aktools
    package_version_live: "0.1.4"
    akshare_version_live: "1.20.22"
    repository: https://github.com/akfamily/aktools
    transport: stdio
    command_env: AKTOOLS_MCP_COMMAND
    default_command: aktools-mcp
    authentication: none
    cost: free_local
    license: MIT
    implements_mcp: true
    raw_mcp_tool_count: 3
    exposed_mcp_tools:
      - search_interfaces
      - describe_interface
      - get_data
    audit_status: accepted_primary_server
    live_evidence: outputs/mcp_discovery_market_v1/
  ftshare:
    server_id: ftshare
    package: FTShare-MCP
    repository: https://github.com/FTShare-Lab/FTShare-MCP
    transport: streamable_http
    url: https://market.ft.tech/gateway/mcp
    authentication: API_key_recommended
    cost: anonymous_quota_or_paid_key
    implements_mcp: true
    raw_mcp_tool_count: 250
    hk_market_raw_tools:
      - ft_v2_hk_hk_candlesticks
      - ft_v1_hk_hsi_daily_weight
      - ft_v1_hk_stk_ah_comparison
    audit_status: blocked
    rejection_reason: >
      tools/list succeeds anonymously, but live Market data calls return
      UPSTREAM_UNAVAILABLE/429 anonymous daily quota; no local FTSHARE_API_KEY.
      Not reproducible for free/local formal gold.

operations:
  # ---- Meta (supporting) ----
  - operation_id: aktools.search_interfaces
    server_id: aktools
    role: supporting
    classification: supporting
    exposed_mcp_tool: search_interfaces
    underlying_interface: null
    name: search_interfaces
    summary: Search AKShare interface names by keyword (Market discovery aid).
    description: >
      Meta tool to locate HK market interfaces such as stock_hk_hist.
      Not a price series itself.
    action_terms: [search, find, interface, market, hist, 港股]
    parameters:
      - {name: keyword, type: string, required: true, description: "Search keyword"}
      - {name: limit, type: number, required: false, default: 20}
    output_fields: [items]
    asset_type: meta
    ticker_format: n/a
    supported_exchanges: [HKEX]
    frequency: n/a
    historical_date_coverage: n/a
    timezone: Asia/Hong_Kong
    currency: n/a
    adjustment_mode: n/a
    data_source_provider: AKShare catalog
    read_only: true
    idempotence: true
    invocation_constraints: ["stdio MCP only"]
    known_risks: ["Keyword mismatch may hide interfaces"]
    audit_status: live_verified
    live_evidence: "outputs/mcp_discovery_market_v1/aktools_market_search.json"
    decision: supporting

  - operation_id: aktools.describe_interface
    server_id: aktools
    role: supporting
    classification: supporting
    exposed_mcp_tool: describe_interface
    underlying_interface: null
    name: describe_interface
    summary: Describe an AKShare interface schema/doc before get_data.
    description: Returns params/doc/outputs for interfaces such as stock_hk_hist.
    action_terms: [describe, schema, parameters, docs]
    parameters:
      - {name: name, type: string, required: true, description: "Interface name"}
    output_fields: [name, params, doc, outputs]
    asset_type: meta
    ticker_format: n/a
    supported_exchanges: [HKEX]
    frequency: n/a
    historical_date_coverage: n/a
    timezone: Asia/Hong_Kong
    currency: n/a
    adjustment_mode: n/a
    data_source_provider: AKShare catalog
    read_only: true
    idempotence: true
    invocation_constraints: ["stdio MCP only"]
    known_risks: []
    audit_status: live_verified
    live_evidence: "outputs/mcp_discovery_market_v1/aktools_market_describe.json"
    decision: supporting

  # ---- Primary price history ----
  - operation_id: aktools.stock_hk_hist
    server_id: aktools
    role: primary
    classification: primary
    exposed_mcp_tool: get_data
    underlying_interface: stock_hk_hist
    name: stock_hk_hist
    summary: HK equity historical OHLCV with explicit date range and adjustment mode (East Money).
    description: >
      Primary Market operation for fixed-date and date-range daily/weekly/monthly
      OHLCV. Parameters include symbol (5-digit HK code), period, start_date/end_date
      (YYYYMMDD), and adjust in {'' unadjusted, qfq forward, hfq backward}.
      Returns 日期/开盘/收盘/最高/最低/成交量/成交额 plus amplitude/change fields.
      Live-verified for 00700, 00005, 09988 including session 2026-08-12.
    action_terms: [price, history, OHLCV, daily, close, volume, turnover, 复权, 港股行情]
    parameters:
      - {name: symbol, type: string, required: true, description: "5-digit HK code e.g. 00700"}
      - {name: period, type: string, required: false, default: daily, description: "daily|weekly|monthly"}
      - {name: start_date, type: string, required: false, description: "YYYYMMDD"}
      - {name: end_date, type: string, required: false, description: "YYYYMMDD"}
      - {name: adjust, type: string, required: false, default: "", description: "''|qfq|hfq"}
      - {name: offset, type: number, required: false, default: 0}
      - {name: max_rows, type: number, required: false, default: 100, description: "MCP get_data page size <=1000"}
    output_fields: [日期, 开盘, 收盘, 最高, 最低, 成交量, 成交额, 振幅, 涨跌幅, 涨跌额, 换手率]
    asset_type: equity
    ticker_format: "5-digit zero-padded HK code (00700/00005/09988)"
    supported_exchanges: [HKEX]
    frequency: daily_or_weekly_or_monthly
    historical_date_coverage: "Date-range selectable; live window includes 2026-08-12"
    timezone: Asia/Hong_Kong
    currency: HKD
    adjustment_mode: "explicit: ''=unadjusted, qfq=forward, hfq=backward"
    data_source_provider: East Money via AKShare
    read_only: true
    idempotence: true
    invocation_constraints:
      - "Must set adjust explicitly for gold"
      - "Filter/clamp dates to <=2026-08-12 for benchmark gold"
      - "Invalid symbol returns execution error (NoneType subscriptable)"
    known_risks:
      - "qfq may equal unadjusted on some recent windows (e.g. Tencent 2026-08-12)"
      - "hfq levels differ materially from unadjusted"
      - "Currency not a dedicated column; treat as HKD by HK feed convention"
    audit_status: live_verified_three_issuers
    live_evidence: "outputs/mcp_discovery_market_v1/aktools_market_probes_hist.json"
    covers_companies: [Tencent, HSBC, Alibaba]
    decision: primary

  - operation_id: aktools.stock_hk_daily
    server_id: aktools
    role: supporting
    classification: supporting
    exposed_mcp_tool: get_data
    underlying_interface: stock_hk_daily
    name: stock_hk_daily
    summary: Sina HK equity full-history daily bars and optional qfq / qfq-factor.
    description: >
      Overlapping OHLCV source (Sina). No start/end params; use get_data negative
      offset to read recent rows, then filter <=2026-08-12. adjust ''|qfq|qfq-factor.
      Useful as corroboration and for adjustment factors; prefer stock_hk_hist for
      explicit date-range gold paths.
    action_terms: [sina, daily, history, qfq-factor, adjustment factor]
    parameters:
      - {name: symbol, type: string, required: true, description: "5-digit HK code"}
      - {name: adjust, type: string, required: false, default: "", description: "''|qfq|qfq-factor"}
      - {name: offset, type: number, required: false, default: 0, description: "Use negative offset for recent rows"}
      - {name: max_rows, type: number, required: false, default: 100}
    output_fields: [date, open, high, low, close, volume, amount, qfq_factor]
    asset_type: equity
    ticker_format: "5-digit zero-padded HK code"
    supported_exchanges: [HKEX]
    frequency: daily
    historical_date_coverage: "Long history; recent rows via offset<0"
    timezone: Asia/Hong_Kong
    currency: HKD
    adjustment_mode: "explicit: ''|qfq|qfq-factor"
    data_source_provider: Sina Finance via AKShare
    read_only: true
    idempotence: true
    invocation_constraints:
      - "Must not treat unfiltered newest row after 2026-08-12 as gold"
      - "Reconcile vs stock_hk_hist with float tolerance (~1e-4)"
    known_risks:
      - "Positive offset from 0 returns oldest history first"
      - "qfq-factor series may include dates after cutoff (filter required)"
      - "amount may disagree slightly with East Money hist"
    audit_status: live_verified_three_issuers
    live_evidence: "outputs/mcp_discovery_market_v1/aktools_market_final_recon.json"
    covers_companies: [Tencent, HSBC, Alibaba]
    decision: supporting

