    description: >
      Historical OHLCV for symbol=HSI. Because series is long, use get_data
      negative offset (e.g. -100) then filter date<=2026-08-12. Live row on
      2026-08-12 close≈25440.17 with volume/amount.
    action_terms: [HSI, Hang Seng, index, benchmark, history]
    parameters:
      - {name: symbol, type: string, required: true, description: "Index code e.g. HSI"}
      - {name: offset, type: number, required: false, default: 0}
      - {name: max_rows, type: number, required: false, default: 100}
    output_fields: [date, open, high, low, close, volume, amount]
    asset_type: index
    ticker_format: "Index code HSI (from stock_hk_index_spot_sina)"
    supported_exchanges: [HKEX]
    frequency: daily
    historical_date_coverage: "Includes 2026-08-12 via negative offset"
    timezone: Asia/Hong_Kong
    currency: index_points
    adjustment_mode: "not_applicable_index_level"
    data_source_provider: Sina Finance via AKShare
    read_only: true
    idempotence: true
    invocation_constraints:
      - "Invalid symbol errors"
      - "Must filter out post-cutoff rows present in negative-offset windows"
    known_risks:
      - "Spot 'latest' from index_spot tools is not historical gold"
      - "Paging with positive offset from start is inefficient for recent dates"
    audit_status: live_verified_HSI_cutoff
    live_evidence: "outputs/mcp_discovery_market_v1/aktools_market_hsi_cutoff_neg_offset.json"
    decision: primary

  - operation_id: aktools.stock_hk_index_daily_em
    server_id: aktools
    role: supporting
    classification: supporting
    exposed_mcp_tool: get_data
    underlying_interface: stock_hk_index_daily_em
