[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-and-execute-mcp-router"
version = "0.1.0"
description = "Plan-and-Execute MCP Router — HK-155 and ETOM-100 routing experiments"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MSBD5018 Group" }]
# Runtime: stdlib HTTP (urllib) + YAML configs. No local file:// dependency URLs.
# Import package remains hk_equity_mcp for historical identity compatibility.
dependencies = [
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Offline unit/integration tests
dev = [
  "pytest>=7.4,<9",
]
# Live HK real-MCP stdio clients (optional; not required for offline suite)
real_mcp = [
  # AKTools MCP server currently expects mcp>=2.3; client adapters support 1.x/2.x.
  "mcp>=1.7.0,<3",
]
# Convenience extra: tests + optional MCP (runtime deps still from [project])
release = [
  "pytest>=7.4,<9",
  "mcp>=1.7.0,<3",
]

[project.scripts]
# Canonical public CLI aliases
mcp-router-demo = "hk_equity_mcp.agent.router:main"
mcp-router-eval = "hk_equity_mcp.evaluation.runner:main"
# Legacy CLI aliases (compat)
hk-equity-demo = "hk_equity_mcp.agent.router:main"
hk-equity-eval = "hk_equity_mcp.evaluation.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
